name: PointVerse
options:
  bundleIdPrefix: com.pointverse
  deploymentTarget:
    iOS: "17.0"
packages:
  PointVerseKit:
    path: PointVerseKit
  WhisperRuntime:
    path: Vendor/WhisperRuntime
targets:
  PointVerse:
    type: application
    platform: iOS
    sources:
      - path: PointVerseApp
        excludes: [Info.plist]
    dependencies:
      - package: PointVerseKit
      - package: WhisperRuntime
        product: whisper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pointverse.poc
        PRODUCT_NAME: 点界
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PointVerseApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PointVerse:
    build:
      targets:
        PointVerse: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
