name: PointVerse
options:
  bundleIdPrefix: com.pointverse
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  PointVerseKit:
    path: PointVerseKit
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
targets:
  PointVerseWatch:
    type: application
    platform: watchOS
    sources:
      - path: PointVerseWatchApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dianjie.pv.watchkitapp
        DEVELOPMENT_TEAM: SS4H5JZU3H
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: 点界 Watch
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PointVerseWatchApp/Info.plist
        SKIP_INSTALL: NO
  PointVerse:
    type: application
    platform: iOS
    sources:
      - path: PointVerseApp
        excludes:
          - Info.plist
          - Features/PointDetail/WhisperRecognizer.swift
          - Features/PointDetail/QwenTitleGenerator.swift
          - Features/PointDetail/ConversationService.swift
          - Features/ModelSettings
          - Features/ImageGeneration/ImageGenerationView.swift
          - Features/ImageGeneration/LocalImageGenerator.swift
          - Features/ImageGeneration/PhotoLibrarySaver.swift
    dependencies:
      - target: PointVerseWatch
      - package: PointVerseKit
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dianjie.pv
        DEVELOPMENT_TEAM: SS4H5JZU3H
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: 点界
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PointVerseApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PointVerseWatch:
    build:
      targets:
        PointVerseWatch: all
    run:
      config: Debug
  PointVerse:
    build:
      targets:
        PointVerse: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
