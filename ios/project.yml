name: PointVerse
options:
  bundleIdPrefix: com.pointverse
  deploymentTarget:
    iOS: "17.0"
packages:
  PointVerseKit:
    path: PointVerseKit
  WhisperRuntime:
    path: Vendor/WhisperRuntime
  LlamaRuntime:
    path: Vendor/LlamaRuntime
  StableDiffusionRuntime:
    url: https://github.com/apple/ml-stable-diffusion.git
    revision: e12202c1f6405b83918b58a5d097cd61e3e1f702
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: d17566fdcb293c2d2304c6b445dd729dd66d470e
targets:
  PointVerse:
    type: application
    platform: iOS
    sources:
      - path: PointVerseApp
        excludes:
          - Info.plist
          - Features/PointDetail/WhisperRecognizer.swift
          - Features/PointDetail/QwenTitleGenerator.swift
    dependencies:
      - package: PointVerseKit
      - target: WhisperAdapter
      - target: QwenAdapter
      - package: StableDiffusionRuntime
        product: StableDiffusion
      - package: ZIPFoundation
        product: ZIPFoundation
    postBuildScripts:
      - name: Embed AI runtimes
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/whisper.framework/whisper
          - $(BUILT_PRODUCTS_DIR)/llama.framework/llama
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/whisper.framework/whisper
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/llama.framework/llama
        script: |
          set -e
          destination="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "${destination}"
          ditto "${BUILT_PRODUCTS_DIR}/whisper.framework" "${destination}/whisper.framework"
          ditto "${BUILT_PRODUCTS_DIR}/llama.framework" "${destination}/llama.framework"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --preserve-metadata=identifier "${destination}/whisper.framework"
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --preserve-metadata=identifier "${destination}/llama.framework"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pointverse.poc
        PRODUCT_NAME: 点界
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PointVerseApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
  WhisperAdapter:
    type: framework
    platform: iOS
    sources:
      - path: PointVerseApp/Features/PointDetail/WhisperRecognizer.swift
    dependencies:
      - package: PointVerseKit
      - package: WhisperRuntime
        product: whisper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pointverse.poc.whisper-adapter
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
  QwenAdapter:
    type: framework
    platform: iOS
    sources:
      - path: PointVerseApp/Features/PointDetail/QwenTitleGenerator.swift
    dependencies:
      - package: PointVerseKit
      - package: LlamaRuntime
        product: llama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pointverse.poc.qwen-adapter
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PointVerse:
    build:
      targets:
        PointVerse: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
