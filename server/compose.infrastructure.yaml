name: pointverse
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile.native:/etc/caddy/Caddyfile:ro
      - ../web:/srv/pointverse-web:ro
      - ../h5:/srv/pointverse-h5:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
