<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>录音记录 · 点界</title><link rel="icon" href="/account/favicon-v1.png"><link rel="stylesheet" href="/h5.css"><link rel="stylesheet" href="/record.css"><script type="module" src="/record.js"></script></head><body><main><header><a href="/" aria-label="返回首页">← 首页</a><h1>录音记录</h1><a href="/account/">我的</a></header><section class="recorder"><h2>说下来，再慢慢想。</h2><p>录音最长 30 分钟。录完可试听，再上传至点界云端识别。</p><p id="account-status" role="status">正在检查登录…</p><a id="login" href="/account/" hidden>登录 / 创建账户</a><div class="record-controls"><button id="start" type="button" disabled>开始录音</button><button id="stop" type="button" hidden>结束录音</button><span id="timer" aria-live="off">00:00 / 30:00</span></div><label class="file-label">或选择音频文件<input id="file" type="file" accept="audio/*" disabled></label><p class="small">浏览器不支持录音时，可用手机录音后选择文件。支持当前浏览器可解码的音频，文件最多 100 MB。</p></section><section id="preview" hidden><h3>试听录音</h3><audio id="audio" controls preload="metadata"></audio><p id="duration" class="small"></p><div class="record-controls"><button id="transcribe" type="button">上传并识别</button><button id="cancel" type="button" hidden>停止等待</button><button id="discard" type="button">丢弃录音</button></div><a id="download-audio" download="pointverse-recording.wav">下载识别用音频</a></section><p id="status" role="status" aria-live="polite"></p><section id="result" hidden><label for="transcript">识别文字（可修改）</label><textarea id="transcript" rows="7" maxlength="50000"></textarea><p id="model" class="small"></p><div class="record-controls"><button id="save" type="button">保存到云端想法</button><button id="copy" type="button">复制文字</button></div><a id="saved" href="/account/library.html" hidden>已保存，查看云端想法 →</a></section><p class="privacy">点击“上传并识别”才会发送录音；点击“保存到云端想法”才会长期保留录音与文字。不会自动读取其他录音或手机资料。</p></main><nav aria-label="主导航"><a href="/">首页</a><a href="/record.html" aria-current="page">录音</a><a href="/account/library.html">想法</a><a href="/account/images.html">生图</a><a href="/account/">我的</a></nav></body></html>
