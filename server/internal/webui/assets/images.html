<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>图片生成 · 点界</title><link rel="icon" href="/account/favicon-v1.png"><link rel="stylesheet" href="/account/style.css"><link rel="stylesheet" href="/account/library.css"><link rel="stylesheet" href="/account/images.css"><script src="/account/images.js" defer></script></head>
<body class="library-body"><header class="library-header"><a class="brand" href="/account/"><img class="brand-mark" src="/account/app-icon-v1.png" width="40" height="40" alt=""><span>点界 <span class="wordmark">PointVerse</span></span></a><a href="/account/library.html">云端想法</a></header>
<main class="image-main"><div class="eyebrow">FROM WORDS TO IMAGES</div><h1>让想法，显影。</h1><p>用中文或英文描述一幅画面，由点界云端生成。</p>
<form id="image-form"><label for="prompt">画面描述</label><textarea id="prompt" rows="5" maxlength="600" required placeholder="例如：晨光穿过森林，一间安静的木屋，水彩画风格"></textarea><p class="field-help">最多 600 字 · 512 × 512 · Stable Diffusion 1.5</p><div class="image-actions"><button class="primary" id="generate" type="submit">生成图片</button><button class="secondary" id="cancel" type="button" hidden>取消任务</button><button class="secondary" id="resume" type="button" hidden>继续查询</button></div></form>
<p id="status" role="status" aria-live="polite">正在检查登录状态…</p><section id="result" hidden><img id="generated" alt="根据你的描述生成的图片" width="512" height="512"><p id="model" class="field-help"></p><a id="save" class="gallery-link" download="pointverse.png">保存图片 ↓</a><p class="field-help">手机浏览器也可长按图片保存。结果在云端保留 24 小时，请及时保存。</p></section><p class="library-foot">点击生成才会发送描述。生成结果不会自动加入云端想法。</p></main></body></html>
