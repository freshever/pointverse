name: pointverse

x-app: &app
  image: pointverse-server:production
  build: .
  environment:
    HTTP_ADDR: :8080
    CLOUD_STORAGE_DIR: /data/cloud
    DATABASE_URL: postgres://pointverse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/pointverse?sslmode=disable
    GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
    APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
    TRUSTED_PROXY_IP: 172.29.50.2
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pointverse
      POSTGRES_USER: pointverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pointverse -d pointverse"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  migrate:
    <<: *app
    entrypoint: [/app/migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    restart: unless-stopped
    volumes:
      - cloud_data:/data/cloud
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default: {}
      edge:
        ipv4_address: 172.29.50.3
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.29.50.2
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    ipam:
      config:
        - subnet: 172.29.50.0/24

volumes:
  postgres_data:
  cloud_data:
  caddy_data:
  caddy_config:
